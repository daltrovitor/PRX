<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fff;color:#0b0b10;font:16px system-ui,sans-serif;padding:24px}main{width:min(100%,420px);text-align:center}.logo svg{width:100%;height:auto}.signal{margin:40px auto 24px;display:flex;align-items:end;justify-content:center;gap:7px;height:40px}.signal i{width:8px;border-radius:5px;background:#6c0cf0;animation:pulse 1.4s infinite}.signal i:nth-child(1){height:12px}.signal i:nth-child(2){height:24px;animation-delay:.2s}.signal i:nth-child(3){height:36px;animation-delay:.4s}p{color:#5b5b66;line-height:1.6}button{border:0;border-radius:40px;padding:16px 24px;background:#6c0cf0;color:white;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.6}small{display:block;margin-top:20px;color:#5b5b66}@keyframes pulse{50%{opacity:.2;transform:scaleY(.65)}}@media(prefers-reduced-motion:reduce){.signal i{animation:none}}</style></head>

</div><div class="signal" aria-hidden="true"><i></i><i></i><i></i></div><h1 id="title">Carregamento demorando</h1><p id="message">O serviço está demorando para responder. Isso também pode acontecer com a internet funcionando. Sua tela ainda não terminou de carregar.</p><button id="retry">Tentar novamente</button><small id="status" role="status">Confira o Wi-Fi ou os dados móveis.</small></main>
<script>
(function(){var button=document.getElementById('retry'),status=document.getElementById('status');
function sync(){document.getElementById('title').textContent=navigator.onLine?'Carregamento demorando':'Sem internet';document.getElementById('message').textContent=navigator.onLine?'O serviço está demorando para responder. Isso também pode acontecer com a internet funcionando. Sua tela ainda não terminou de carregar.':'Reconecte o Wi-Fi ou os dados móveis para continuar.';}
async function retry(){button.disabled=true;status.textContent='Verificando conexão…';var controller=new AbortController();var timer=setTimeout(function(){controller.abort();},8000);try{var response=await fetch('/manifest.json?connectivity='+Date.now(),{method:'HEAD',cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('network');status.textContent='Conexão disponível. Abrindo PRX…';window.location.reload();}catch(e){sync();status.textContent=navigator.onLine?'A conexão ainda está lenta ou indisponível. Tente novamente.':'Sem internet. Confira a conexão.';button.disabled=false;}finally{clearTimeout(timer);}}
button.addEventListener('click',retry);window.addEventListener('online',sync);window.addEventListener('offline',sync);sync();})();
</script></body></html>
